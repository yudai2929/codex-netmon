[tools]
go = "1.26.5"

[tasks.test]
description = "Run the Go test suite"
run = "go test ./..."

[tasks.build]
description = "Build the codex-netmon CLI"
run = "go build -o dist/codex-netmon ."

[tasks.run]
description = "Monitor Codex Wi-Fi traffic in the foreground"
run = "go run ."

[tasks.service-start]
description = "Build and start the optional macOS LaunchAgent"
run = "sh ./scripts/launchd-start.sh"

[tasks.service-stop]
description = "Stop the optional macOS LaunchAgent"
run = "sh ./scripts/launchd-stop.sh"

[tasks.fmt]
description = "Format all Go source files"
run = "gofmt -w ."

[tasks.fmt-check]
description = "Check Go source formatting"
run = 'test -z "$(gofmt -l .)"'

[tasks.lint]
description = "Run Go static analysis for the CLI and dashboard generator"
run = "go vet ./..."

[tasks.dashboard]
description = "Generate the Codex netmon Grafana dashboard with the Go SDK"
run = "go run ./dashboard/cmd/generate"

[tasks.up]
description = "Start the optional local Grafana and OTLP receiver"
depends = ["dashboard"]
run = "docker compose up -d"

[tasks.down]
description = "Stop the optional local Grafana stack"
run = "docker compose down"
